name: iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo-doctor
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: npx pod-install ios
      - run: xcodebuild -workspace ios/Dubora.xcworkspace -scheme Dubora -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - run: mkdir -p Payload
      - run: cp -R build/Build/Products/Release-iphoneos/Dubora.app Payload/
      - run: zip -r Dubora-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dubora-ios-unsigned
          path: Dubora-unsigned.ipa
